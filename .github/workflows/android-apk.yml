name: Build ANGEL AI APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (all, debug, release)'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'debug'
          - 'release'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradlew Executable
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Prepare Build Credentials & Config
        env:
          GOOGLE_SERVICES_JSON_SECRET: ${{ secrets.GOOGLE_SERVICES_JSON }}
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          # Inject google-services.json from secret if provided and missing
          if [ -n "$GOOGLE_SERVICES_JSON_SECRET" ] && [ ! -f "app/google-services.json" ]; then
            echo "$GOOGLE_SERVICES_JSON_SECRET" > app/google-services.json
            echo "Successfully restored app/google-services.json from repository secret."
          fi

          # Ensure debug.keystore is ready
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > debug.keystore
            echo "Restored debug.keystore from repository secret."
          elif [ ! -f "debug.keystore" ] && [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
            echo "Decoded debug.keystore from debug.keystore.base64."
          fi

          if [ ! -f "app/google-services.json" ]; then
            echo "::error::app/google-services.json is missing!"
            exit 1
          fi

      - name: Build Debug APK
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.build_type == 'all' || github.event.inputs.build_type == 'debug' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          HIVE_API_KEY: ${{ secrets.HIVE_API_KEY }}
          META_API_KEY: ${{ secrets.META_API_KEY }}
        run: |
          echo "Building Debug APK..."
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build Release APK (Optional)
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.build_type == 'all' || github.event.inputs.build_type == 'release' }}
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.JARVIS_RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.JARVIS_RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.JARVIS_RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.JARVIS_RELEASE_KEY_PASSWORD }}
          RELEASE_CERT_SHA256: ${{ secrets.JARVIS_RELEASE_CERT_SHA256 }}
          DEVELOPER_NAME: ${{ secrets.JARVIS_DEVELOPER_NAME }}
          COPYRIGHT_OWNER: ${{ secrets.JARVIS_COPYRIGHT_OWNER }}
          VERIFICATION_ENDPOINT: ${{ secrets.JARVIS_VERIFICATION_ENDPOINT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          HIVE_API_KEY: ${{ secrets.HIVE_API_KEY }}
          META_API_KEY: ${{ secrets.META_API_KEY }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ] && [ -n "$RELEASE_STORE_PASSWORD" ] && [ -n "$RELEASE_KEY_ALIAS" ] && [ -n "$RELEASE_KEY_PASSWORD" ]; then
            echo "Release signing credentials detected. Building Release APK..."
            KEYSTORE_FILE=$(mktemp /tmp/release-keystore.XXXXXX.jks)
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_FILE"
            
            export JARVIS_RELEASE_STORE_FILE="$KEYSTORE_FILE"
            export JARVIS_RELEASE_STORE_PASSWORD="$RELEASE_STORE_PASSWORD"
            export JARVIS_RELEASE_KEY_ALIAS="$RELEASE_KEY_ALIAS"
            export JARVIS_RELEASE_KEY_PASSWORD="$RELEASE_KEY_PASSWORD"
            export JARVIS_RELEASE_CERT_SHA256="$RELEASE_CERT_SHA256"
            export JARVIS_DEVELOPER_NAME="$DEVELOPER_NAME"
            export JARVIS_COPYRIGHT_OWNER="$COPYRIGHT_OWNER"
            export JARVIS_VERIFICATION_ENDPOINT="$VERIFICATION_ENDPOINT"
            
            ./gradlew assembleRelease --no-daemon --stacktrace
            
            rm -f "$KEYSTORE_FILE"
            echo "Release APK build finished successfully."
          else
            echo "Release signing secrets not configured. Skipping release build."
          fi

      - name: Verify APK Outputs
        id: verify_apk
        run: |
          FOUND_COUNT=$(find app/build/outputs/apk -type f -name "*.apk" | wc -l)
          if [ "$FOUND_COUNT" -eq 0 ]; then
            echo "::error::No APK files were found under app/build/outputs/apk!"
            exit 1
          fi
          echo "Verified $FOUND_COUNT APK file(s):"
          find app/build/outputs/apk -type f -name "*.apk" -exec ls -lh {} +

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ANGEL-AI-APK
          path: app/build/outputs/apk/**/*.apk
          retention-days: 14
          if-no-files-found: error

      - name: Create GitHub Release & Upload APKs
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/**/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: false

      - name: Publish Build Summary
        if: always()
        run: |
          echo "## 🤖 ANGEL AI — Automatic APK Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Parameter | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Repository** | \`${{ github.repository }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch / Tag** | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit Hash** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Trigger Event** | \`${{ github.event_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Workflow Status** | ${{ job.status == 'success' && '✅ SUCCESS' || '❌ FAILED' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -d "app/build/outputs/apk" ]; then
            echo "### 📦 Generated APK Files" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`text" >> $GITHUB_STEP_SUMMARY
            find app/build/outputs/apk -type f -name "*.apk" -exec ls -lh {} + >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "👉 **How to download your APK**: In GitHub, open the **Actions** tab, click this workflow run, scroll down to the **Artifacts** section at the bottom, and click **ANGEL-AI-APK**." >> $GITHUB_STEP_SUMMARY
          fi
