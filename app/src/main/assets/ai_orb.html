<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        :root {
            --red-core: #ff1744;
            --red-glow: rgba(255, 23, 68, 0.6);
            --red-deep: #7a000d;
            --white-heat: #ffffff;
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            transition: opacity 1s ease;
        }

        .reactor-container {
            position: relative;
            width: 150px;
            height: 150px;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* External SVG Rings for better precision */
        .svg-rings {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .ring-outer {
            animation: rotateCW 10s linear infinite;
        }

        .ring-inner {
            animation: rotateCCW 6s linear infinite;
        }

        @keyframes rotateCW {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes rotateCCW {
            from { transform: rotate(0deg); }
            to { transform: rotate(-360deg); }
        }

        /* Fusion Core */
        .core {
            position: relative;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: radial-gradient(circle at 40% 40%, var(--red-core) 0%, var(--red-deep) 100%);
            box-shadow: 
                0 0 20px var(--red-glow),
                0 0 40px rgba(255, 23, 68, 0.3),
                inset 0 0 15px rgba(255, 255, 255, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            animation: breathe 4s ease-in-out infinite;
            z-index: 10;
        }

        .nucleus {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: radial-gradient(circle, var(--white-heat) 0%, #fff59d 40%, var(--red-core) 100%);
            box-shadow: 0 0 15px var(--white-heat), 0 0 30px var(--red-core);
            transition: transform 0.2s ease-out;
        }

        @keyframes breathe {
            0%, 100% { transform: scale(1); box-shadow: 0 0 20px var(--red-glow); }
            50% { transform: scale(1.05); box-shadow: 0 0 35px var(--red-core); }
        }

        /* Speaking State */
        body.speaking .core {
            animation: vibrate 0.1s infinite;
            box-shadow: 0 0 50px var(--red-core), inset 0 0 25px rgba(255, 255, 255, 0.6);
        }

        body.speaking .nucleus {
            transform: scale(1.2);
            box-shadow: 0 0 25px var(--white-heat);
        }

        @keyframes vibrate {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }

        /* Wake/Sleep animations */
        body.waking .reactor-container {
            transform: scale(1.3);
            filter: brightness(2);
        }

        body.sleeping {
            opacity: 0.3;
        }
        body.sleeping .reactor-container {
            transform: scale(0.6);
        }
        body.sleeping .nucleus {
            background: #333;
            box-shadow: none;
        }

    </style>
</head>
<body>
    <div class="reactor-container">
        <svg class="svg-rings" viewBox="0 0 100 100">
            <g class="ring-outer">
                <circle cx="50" cy="50" r="48" fill="none" stroke="var(--red-glow)" stroke-width="0.5" stroke-dasharray="2 4" />
                <circle cx="50" cy="50" r="45" fill="none" stroke="var(--red-core)" stroke-width="2" stroke-dasharray="10 20" opacity="0.6"/>
            </g>
            <g class="ring-inner">
                <circle cx="50" cy="50" r="38" fill="none" stroke="var(--red-glow)" stroke-width="1" stroke-dasharray="1 5" />
            </g>
        </svg>
        <div class="core">
            <div class="nucleus"></div>
        </div>
    </div>

    <script>
        function setSpeaking(isSpeaking) {
            if (isSpeaking) document.body.classList.add('speaking');
            else document.body.classList.remove('speaking');
        }

        function triggerWake() {
            document.body.classList.remove('sleeping');
            document.body.classList.add('waking');
            setTimeout(() => {
                document.body.classList.remove('waking');
            }, 1000);
        }

        function triggerSleep() {
            document.body.classList.remove('waking');
            document.body.classList.add('sleeping');
        }
    </script>
</body>
</html>
